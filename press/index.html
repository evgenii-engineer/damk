<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="canonical" href="https://evgdamk.com/press/"/>
    <title>Press & Collaborations — EVG DAMK</title>
    <meta name="description"
          content="Press, interviews, artist features, exhibitions and creative collaborations with EVG DAMK.">
    <link rel="stylesheet" href="/css/styles.css"/>
    <script data-goatcounter="https://damk.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
    <link rel="icon" href="/assets/favicon.ico" type="image/x-icon"/>
</head>
<body class="info-page">
<header>
    <nav>
        <a href="/">about</a>
        <a href="/archive">archive</a>
        <a href="/shop">shop</a>
        <a href="/game">game</a>
        <a href="/press" aria-current="page">press</a>
        <a href="/contact">contact</a>
    </nav>
</header>

<main class="info-main">
    <section class="info-copy">
        <p class="page-kicker">EVG DAMK</p>
        <h1>Press / Collaborations</h1>
        <p class="page-lead">I'm open to interviews, artist features, exhibitions and creative collaborations.</p>
        <p>If you'd like to write about my work or discuss a project, feel free to get in touch.</p>
        <p><a href="/contact" class="cta-link">Contact details</a></p>
    </section>
</main>

<footer>
    <img src="/assets/monkey1.png" alt="monkey" class="monkey" id="monkey"/>
</footer>

<script>
    const monkey = document.getElementById('monkey');
    const images = ['monkey1.png', 'monkey2.png', 'monkey3.png', 'monkey4.png'];
    let clickable = true;

    monkey.addEventListener('click', () => {
        if (!clickable) return;

        const current = monkey.getAttribute('src').split('/').pop();
        const others = images.filter(img => img !== current);
        const next = others[Math.floor(Math.random() * others.length)];

        const tempImg = new Image();
        tempImg.onload = () => {
            monkey.setAttribute('src', '/assets/' + next);

            if (next === 'monkey3.png') {
                clickable = false;

                monkey.style.transition = 'none';
                monkey.style.transform = 'rotate(0deg) scale(1)';
                void monkey.offsetWidth;
                monkey.style.transition = 'transform 1.8s ease-in-out';
                monkey.style.transform = 'rotate(1440deg) scale(2.5)';

                setTimeout(() => {
                    monkey.style.transform = 'rotate(0deg) scale(1)';
                    clickable = true;
                }, 2000);
            }
        };
        tempImg.src = '/assets/' + next;
    });
</script>
</body>
</html>
